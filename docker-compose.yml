services:
  postgres:
    image: postgres:15
    container_name: probank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-probank_dev}
      POSTGRES_USER: ${POSTGRES_USER:-probank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-probank_dev}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - probank-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  probank-postgres-data:
