server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 90m
      cookie:
        http-only: true
        same-site: lax
        # 로컬 HTTP 개발이 가능하도록 기본값은 false 이지만, 운영 환경에서는
        # 반드시 SESSION_COOKIE_SECURE=true 로 설정해 HTTPS 로만 쿠키가 전송되게 한다.
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: probank-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/probank_dev}
    username: ${DB_USERNAME:probank}
    password: ${DB_PASSWORD:probank_dev}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:/mappers/probank/**/*.xml
  type-aliases-package: com.daeryun.probank.domain
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    max-failed-attempts: 5
    lockout-minutes: 15
  bootstrap:
    super-admin:
      employee-no: ${BOOTSTRAP_ADMIN_EMPLOYEE_NO:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:changeme1234}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@company.local}
  upload:
    image-dir: ${UPLOAD_IMAGE_DIR:./uploads/images}
